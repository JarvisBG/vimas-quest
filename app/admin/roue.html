<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <title>Roue et lots | Console Vimas Quest</title>
  <script src="../assets/js/console-theme.js"></script>
  <link rel="stylesheet" href="../assets/css/console.css">
</head>
<body class="sans-sw">
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <div class="bg-layer bg-glow"></div>
  <div class="bg-layer bg-grid"></div>

  <div class="console-grille">
    <nav class="cnav" aria-label="Console">
      <a class="cnav__marque" href="index.html"><i data-icon="onde"></i> VIMAS QUEST</a>
      <p class="cnav__tag" data-console-tag>Game Master</p>
      <div data-console-nav></div>
      <div class="cnav__pied">
        <p class="cnav__qui" data-console-qui></p>
        <button class="cnav__sortir" type="button" data-console-sortir><i data-icon="sortie"></i> Déconnexion</button>
      </div>
    </nav>
    <div class="console-voile" data-console-voile></div>
    <button class="ctete__menu" type="button" aria-expanded="false" data-console-menu><i data-icon="menu"></i><span class="sr-only">Ouvrir le menu</span></button>

    <div class="console-principal">
      <div class="ccorps">
        <header class="ctete">
          <div class="ctete__titres">
            <p class="ctete__sur">Animation</p>
            <h1 class="ctete__titre">Roue et lots</h1>
            <p class="ctete__sous" data-resume>Chargement…</p>
          </div>
          <div class="ctete__actions">
            <button class="cbtn cbtn--primaire" type="button" data-nouveau>Nouveau lot</button>
            <span class="cpuce-admin"><i data-icon="cadenas"></i><span data-console-nom>GM</span></span>
          </div>
        </header>

        <main class="ccontenu" id="contenu" data-console-contenu>
          <div class="cdeux">
            <div class="ccolonne">
              <section class="cpanneau cpanneau--table" aria-labelledby="t-lots">
                <div class="cpanneau__tete">
                  <h2 class="cpanneau__titre" id="t-lots"><i data-icon="roue"></i> Lots</h2>
                  <span class="cpanneau__note">chance = poids du lot ÷ poids des lots allumés en stock</span>
                </div>
                <div class="ctable-defile">
                  <table class="ctable">
                    <thead>
                      <tr>
                        <th scope="col">Lot</th>
                        <th scope="col" class="ctable__nb">Chance</th>
                        <th scope="col" class="ctable__nb">Stock</th>
                        <th scope="col">Sur la roue</th>
                        <th scope="col"><span class="sr-only">Modifier</span></th>
                      </tr>
                    </thead>
                    <tbody data-lots><tr><td colspan="5" class="cvide">Chargement…</td></tr></tbody>
                  </table>
                </div>
              </section>
            </div>

            <div class="ccolonne">
              <section class="cpanneau" aria-labelledby="t-retrait">
                <h2 class="cpanneau__titre" id="t-retrait"><i data-icon="cadeau"></i> Remettre un lot</h2>
                <form class="cform" data-retrait novalidate>
                  <label class="champ">
                    <span class="champ__label">Code du bon (téléphone du joueur)</span>
                    <input class="saisie" name="code" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="A3F9C1" required>
                  </label>
                  <p class="message" role="alert" data-retrait-message hidden></p>
                  <button class="cbtn cbtn--primaire" type="submit"><i data-icon="coche"></i> Marquer comme remis</button>
                </form>
              </section>

              <section class="cpanneau" aria-labelledby="t-reglages">
                <h2 class="cpanneau__titre" id="t-reglages"><i data-icon="eclair"></i> Réglages</h2>
                <form class="cform" data-reglages novalidate>
                  <div class="cform__ligne">
                    <label class="champ">
                      <span class="champ__label">Coût d'un tirage</span>
                      <input class="saisie" name="cout" type="number" min="1" max="100000" step="1" required>
                      <span class="champ__aide">en jetons</span>
                    </label>
                    <label class="champ">
                      <span class="champ__label">Tirages par jour</span>
                      <input class="saisie" name="plafond" type="number" min="0" max="1000" step="1" required>
                      <span class="champ__aide">par joueur, de 6 h à 6 h ; 0 = sans limite</span>
                    </label>
                  </div>
                  <p class="message" role="alert" data-reglages-erreur hidden></p>
                  <button class="cbtn" type="submit"><i data-icon="coche"></i> Enregistrer les réglages</button>
                </form>
              </section>

              <section class="cpanneau" aria-labelledby="t-bons">
                <div class="cpanneau__tete">
                  <h2 class="cpanneau__titre" id="t-bons"><i data-icon="billet"></i> Derniers bons</h2>
                  <span class="cpanneau__note" data-bons-note></span>
                </div>
                <ul class="cliste" data-bons><li class="cvide">Chargement…</li></ul>
              </section>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- Création / modification d'un lot -->
  <dialog class="cboite cfiche" data-boite aria-labelledby="b-titre">
    <div class="cfiche__tete">
      <span class="cfiche__avatar"><i data-icon="cadeau"></i></span>
      <div class="cfiche__titres">
        <h2 class="cboite__titre" id="b-titre" data-b-titre>Nouveau lot</h2>
        <p class="cfiche__sous" data-b-sous></p>
      </div>
      <button class="cbtn cbtn--icone" type="button" data-fermer><i data-icon="fermer"></i><span class="sr-only">Fermer</span></button>
    </div>
    <form class="cfiche__corps cform" data-form novalidate>
      <div class="cform__ligne">
        <label class="champ">
          <span class="champ__label">Nom du lot</span>
          <input class="saisie" name="nom" maxlength="60" required autocomplete="off" placeholder="Casquette VIMAS FEST">
        </label>
        <label class="champ">
          <span class="champ__label">Libellé sur la roue</span>
          <input class="saisie" name="court" maxlength="12" autocomplete="off" placeholder="Casquette">
          <span class="champ__aide">12 caractères au plus ; vide = le nom</span>
        </label>
      </div>
      <div class="cform__trois">
        <label class="champ">
          <span class="champ__label">Ce que l'on gagne</span>
          <select class="saisie" name="genre">
            <option value="objet">Un objet (bon à retirer)</option>
            <option value="xp">Des XP</option>
            <option value="jetons">Des jetons</option>
            <option value="badge">Un badge</option>
            <option value="rien">Rien (case vide)</option>
          </select>
        </label>
        <label class="champ" data-champ-valeur>
          <span class="champ__label" data-valeur-label>Combien</span>
          <input class="saisie" name="valeur" type="number" min="0" max="100000" step="1">
        </label>
        <label class="champ" data-champ-badge hidden>
          <span class="champ__label">Badge</span>
          <select class="saisie" name="badge" data-badges></select>
        </label>
        <label class="champ">
          <span class="champ__label">Rareté (couleur)</span>
          <select class="saisie" name="rarete">
            <option value="commun">Commun</option>
            <option value="rare">Rare</option>
            <option value="epique">Épique</option>
            <option value="legendaire">Légendaire</option>
          </select>
        </label>
      </div>
      <div class="cform__ligne">
        <label class="champ">
          <span class="champ__label">Poids</span>
          <input class="saisie" name="poids" type="number" min="0" max="100000" step="1" required>
          <span class="champ__aide" data-aide-poids>Plus il est lourd, plus il sort souvent.</span>
        </label>
        <label class="champ">
          <span class="champ__label">Stock restant</span>
          <input class="saisie" name="stock" type="number" min="0" max="100000" step="1" placeholder="illimité">
          <span class="champ__aide">Vide = illimité. Baisse à chaque gain ; à 0, le lot ne sort plus.</span>
        </label>
      </div>
      <fieldset class="champ">
        <legend class="champ__label">Icône</legend>
        <div class="cicones" data-icones></div>
      </fieldset>
      <label class="ccase"><input type="checkbox" name="actif" checked><span>Sur la roue<small>Éteint : il disparaît de la roue des téléphones, les bons déjà gagnés restent valables.</small></span></label>
      <p class="message" role="alert" data-erreur hidden></p>
    </form>
    <div class="cfiche__pied">
      <button class="cbtn cbtn--danger" type="button" data-supprimer hidden><i data-icon="croix"></i> Supprimer</button>
      <button class="cbtn" type="button" data-fermer>Annuler</button>
      <button class="cbtn cbtn--primaire" type="button" data-enregistrer><i data-icon="coche"></i> Enregistrer</button>
    </div>
  </dialog>

  <script src="../assets/js/config.js" defer></script>
  <script src="../assets/js/app.js" defer></script>
  <script src="../assets/js/vendor/supabase.min.js" defer></script>
  <script src="../assets/js/serveur.js" defer></script>
  <script src="../assets/js/console.js" defer></script>
  <script src="../assets/js/pages/console-roue.js" defer></script>
</body>
</html>
